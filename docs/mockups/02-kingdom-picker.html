<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dominion — Kingdom Picker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sol: {
              base03:'#002b36', base02:'#073642', base01:'#586e75',
              base00:'#657b83', base0:'#839496',  base1:'#93a1a1',
              base2:'#eee8d5',  base3:'#fdf6e3',
              yellow:'#b58900', orange:'#cb4b16', red:'#dc322f',
              magenta:'#d33682',violet:'#6c71c4', blue:'#268bd2',
              cyan:'#2aa198',   green:'#859900',
            },
          },
          fontFamily: {
            serif:['Georgia','Cambria','Times New Roman','serif'],
            mono: ['SFMono-Regular','Menlo','Consolas','monospace'],
          },
        },
      },
    }
  </script>
  <style>
    body { background-color:#fdf6e3; color:#657b83; }
    .shadow-sol    { box-shadow:0 1px 4px rgba(0,43,54,.10),0 2px 10px rgba(0,43,54,.07); }
    .shadow-sol-lg { box-shadow:0 4px 24px rgba(0,43,54,.14),0 1px 6px rgba(0,43,54,.08); }

    .card-tile { transition:transform .18s ease,box-shadow .18s ease,z-index 0s; cursor:pointer; position:relative; z-index:0; }
    .card-tile:hover { transform:scale(1.12); box-shadow:0 12px 32px rgba(0,43,54,.25); z-index:20; }
    .card-tile.selected .sel-check { opacity:1; }
    .card-tile.selected img { filter: brightness(0.75); }
    .sel-check { opacity:0; transition:opacity .12s; }

    /* type badge */
    .badge-action   { background:#eee8d5; color:#586e75; border:1px solid #93a1a1; }
    .badge-attack   { background:#fbe9e7; color:#cb4b16; border:1px solid #cb4b16; }
    .badge-reaction { background:#ede7f6; color:#6c71c4; border:1px solid #6c71c4; }

    /* card art backgrounds — Middle Age palette */
    .art-action   {
      background: linear-gradient(160deg, #c8a84b 0%, #8a6820 40%, #4a3510 100%);
    }
    .art-attack   {
      background: linear-gradient(160deg, #8b2222 0%, #5a1010 40%, #250808 100%);
    }
    .art-reaction {
      background: linear-gradient(160deg, #1e4060 0%, #0d2540 40%, #060f1a 100%);
    }

    /* inner illumination border */
    .art-inner {
      position:absolute; inset:4px;
      border:1px solid rgba(255,255,255,0.15);
      border-radius:4px;
      pointer-events:none;
    }

    /* corner ornament */
    .art-corner {
      position:absolute;
      font-size:9px;
      line-height:1;
      color:rgba(255,255,255,0.35);
      pointer-events:none;
    }
  </style>
</head>
<body class="min-h-screen font-serif flex flex-col">

  <!-- Header -->
  <header class="bg-sol-base2 border-b border-sol-base1/30 sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button class="text-sol-base1 hover:text-sol-base00 transition-colors mr-1 text-lg">←</button>
        <div class="w-8 h-8 rounded-full bg-sol-yellow/15 border border-sol-yellow/40 flex items-center justify-center">
          <span class="text-sol-yellow text-base leading-none">♛</span>
        </div>
        <h1 class="text-xl font-serif tracking-widest text-sol-base02 uppercase">Dominion</h1>
      </div>
      <span class="text-xs tracking-widest uppercase text-sol-base1">Kingdom Picker</span>
    </div>
  </header>

  <!-- Sticky selection bar -->
  <div class="bg-sol-base3 border-b border-sol-base1/20 sticky top-[57px] z-10 shadow-sol">
    <div class="max-w-6xl mx-auto px-6 py-3 flex items-center justify-between gap-4">
      <div class="flex-1"></div>
      <div class="flex items-center gap-4 shrink-0">
        <span class="text-sol-base02 text-xl font-bold whitespace-nowrap">
          <span id="count">0</span><span class="text-sol-base1 font-normal text-base"> / 10</span>
        </span>
        <button onclick="randomize()" class="bg-sol-base2 hover:bg-sol-base1/30 border border-sol-base1 text-sol-base02 font-bold text-xs px-4 py-1.5 rounded-lg transition-colors uppercase tracking-wider font-serif">
          Randomize
        </button>
        <button onclick="clearAll()" class="text-sol-base1 hover:text-sol-base00 text-xs px-3 py-1.5 transition-colors font-serif uppercase tracking-wider">
          Clear
        </button>
        <button id="confirm-btn" disabled
          class="bg-sol-base1/40 text-white text-sm font-bold px-6 py-2 rounded-lg uppercase tracking-widest font-serif cursor-not-allowed transition-colors">
          Confirm →
        </button>
      </div>
    </div>
    <div class="h-0.5 bg-sol-base2">
      <div id="prog-bar" class="h-0.5 bg-sol-blue transition-all duration-300" style="width:0%"></div>
    </div>
  </div>

  <main id="grid-root" class="max-w-6xl mx-auto px-6 py-6 flex-1"></main>

  <script>
    // ── Card data ────────────────────────────────────────────────────────
    const TIERS = [
      {
        label: 'Tier 1 — Stat Boost',
        cards: [
          { id:'village',      name:'Village',      cost:3, type:'action',   icon:'🏡',  text:'+1 Card. +2 Actions.' },
          { id:'smithy',       name:'Smithy',       cost:4, type:'action',   icon:'⚒️',  text:'+3 Cards.' },
          { id:'festival',     name:'Festival',     cost:5, type:'action',   icon:'🎠',  text:'+2 Actions. +1 Buy. +2 Coins.' },
          { id:'laboratory',   name:'Laboratory',   cost:5, type:'action',   icon:'📜',  text:'+2 Cards. +1 Action.' },
          { id:'market',       name:'Market',       cost:5, type:'action',   icon:'⚖️',  text:'+1 Card. +1 Action. +1 Buy. +1 Coin.' },
          { id:'council_room', name:'Council Room', cost:5, type:'action',   icon:'🗝️',  text:'+4 Cards. +1 Buy. Each other player draws a card.' },
        ],
      },
      {
        label: 'Tier 2 — Decisions',
        cards: [
          { id:'cellar',      name:'Cellar',      cost:2, type:'action', icon:'🍷',  text:'+1 Action. Discard any number of cards, then draw that many.' },
          { id:'chapel',      name:'Chapel',      cost:2, type:'action', icon:'⛪',  text:'Trash up to 4 cards from your hand.' },
          { id:'workshop',    name:'Workshop',    cost:3, type:'action', icon:'🪓',  text:'Gain a card costing up to 4.' },
          { id:'harbinger',   name:'Harbinger',   cost:3, type:'action', icon:'⛵',  text:'+1 Card. +1 Action. You may put a card from your discard pile onto your deck.' },
          { id:'vassal',      name:'Vassal',      cost:3, type:'action', icon:'🛡️',  text:'+2 Coins. Discard the top card of your deck. If it\'s an Action card, you may play it.' },
          { id:'moneylender', name:'Moneylender', cost:4, type:'action', icon:'🪙',  text:'You may trash a Copper from your hand for +3 Coins.' },
          { id:'poacher',     name:'Poacher',     cost:4, type:'action', icon:'🏹',  text:'+1 Card. +1 Action. +1 Coin. Discard a card per empty Supply pile.' },
          { id:'remodel',     name:'Remodel',     cost:4, type:'action', icon:'🔨',  text:'Trash a card from your hand. Gain a card costing up to 2 more than it.' },
          { id:'mine',        name:'Mine',        cost:5, type:'action', icon:'⛏️',  text:'Trash a Treasure from your hand. Gain a Treasure costing up to 3 more than it, into your hand.' },
          { id:'artisan',     name:'Artisan',     cost:6, type:'action', icon:'🪡',  text:'Gain a card costing up to 5 to your hand. Put a card from your hand onto your deck.' },
        ],
      },
      {
        label: 'Tier 3 — Attacks & Reactions',
        cards: [
          { id:'witch',      name:'Witch',      cost:5, type:'attack',   icon:'🧙',  text:'+2 Cards. Each other player gains a Curse.' },
          { id:'militia',    name:'Militia',    cost:4, type:'attack',   icon:'⚔️',  text:'+2 Coins. Each other player discards down to 3 cards in hand.' },
          { id:'bureaucrat', name:'Bureaucrat', cost:4, type:'attack',   icon:'📜',  text:'Gain a Silver onto your deck. Each other player reveals a Victory card from their hand and puts it onto their deck.' },
          { id:'bandit',     name:'Bandit',     cost:5, type:'attack',   icon:'🗡️',  text:'Gain a Gold. Each other player reveals their top 2 cards, trashes a non-Copper Treasure, and discards the rest.' },
          { id:'moat',       name:'Moat',       cost:2, type:'reaction', icon:'🏰',  text:'+2 Cards. When another player plays an Attack, you may reveal this from your hand to be unaffected by it.' },
        ],
      },
    ];

    // ── Render ───────────────────────────────────────────────────────────
    const root = document.getElementById('grid-root');
    const allCards = TIERS.flatMap(t => t.cards);

    const cards = allCards.map(c => {
      const artClass = c.type === 'attack' ? 'art-attack' : c.type === 'reaction' ? 'art-reaction' : 'art-action';
      return `
        <div class="card-tile rounded-xl overflow-hidden border border-sol-base1/25 shadow-sol"
             data-id="${c.id}" onclick="toggle(this)">
          <div class="relative">
            <div class="absolute inset-0 ${artClass} flex items-center justify-center">
              <div class="art-inner rounded"></div>
              <span class="art-corner" style="top:6px;left:7px">❧</span>
              <span class="art-corner" style="top:6px;right:7px">❧</span>
              <span class="art-corner" style="bottom:6px;left:7px">❧</span>
              <span class="art-corner" style="bottom:6px;right:7px">❧</span>
              <span class="text-4xl select-none drop-shadow-md">${c.icon}</span>
            </div>
            <img src="cards/${c.id}.jpg" alt="${c.name}" class="relative w-full h-auto block z-10" />
            <div class="sel-check absolute top-1.5 right-1.5 w-5 h-5 bg-sol-blue rounded-full flex items-center justify-center shadow z-20">
              <span class="text-white text-[10px] font-bold">✓</span>
            </div>
          </div>
        </div>`;
    }).join('');

    root.innerHTML = `<div class="grid grid-cols-7 gap-2">${cards}</div>`;

    // ── Selection logic ──────────────────────────────────────────────────
    const MAX = 10;
    const selected = new Set();
    const ALL_IDS  = TIERS.flatMap(t => t.cards.map(c => c.id));

    function toggle(el) {
      const id = el.dataset.id;
      if (selected.has(id)) {
        selected.delete(id);
        el.classList.remove('selected');
      } else {
        if (selected.size >= MAX) return;
        selected.add(id);
        el.classList.add('selected');
      }
      updateBar();
    }

    function clearAll() {
      selected.clear();
      document.querySelectorAll('.card-tile').forEach(el => el.classList.remove('selected'));
      updateBar();
    }

    function randomize() {
      clearAll();
      [...ALL_IDS].sort(() => Math.random() - 0.5).slice(0, MAX).forEach(id => {
        selected.add(id);
        document.querySelector(`[data-id="${id}"]`).classList.add('selected');
      });
      updateBar();
    }

    function updateBar() {
      const n = selected.size;
      document.getElementById('count').textContent = n;
      document.getElementById('prog-bar').style.width = (n / MAX * 100) + '%';

      const btn = document.getElementById('confirm-btn');
      const ready = n === MAX;
      btn.disabled = !ready;
      btn.className = ready
        ? 'bg-sol-blue hover:bg-sol-blue/90 text-white text-sm font-bold px-6 py-2 rounded-lg uppercase tracking-widest font-serif transition-colors shadow-sol cursor-pointer'
        : 'bg-sol-base1/40 text-white text-sm font-bold px-6 py-2 rounded-lg uppercase tracking-widest font-serif cursor-not-allowed transition-colors';

    }
  </script>

</body>
</html>
